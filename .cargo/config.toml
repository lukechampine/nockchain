
[profile.release.package."wgpu-hal"]
debug-assertions = true

[profile.release-v4]
inherits = "release"
rustflags = ["-C", "target-cpu=x86-64-v4", "-C", "force-frame-pointers=yes"]
opt-level = 3
lto = "thin"

[profile.release-native]
inherits = "release-v4"
rustflags = ["-C", "target-cpu=native", "-C", "force-frame-pointers=yes"]
